[package]
name = "filefacts-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# A member of the root workspace (see ../Cargo.toml): it shares the root's
# Cargo.lock, [patch.crates-io] forks and profiles.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The library only: the CLI feature and jemalloc have nothing to fuzz.
filefacts = { path = "..", default-features = false }

[[bin]]
name = "open_all_views"
path = "fuzz_targets/open_all_views.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fileid"
path = "fuzz_targets/fileid.rs"
test = false
doc = false
bench = false

