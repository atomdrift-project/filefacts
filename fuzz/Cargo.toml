[package]
name = "filefacts-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
filefacts = { path = ".." }

# Its own workspace, so the fuzz crate never joins the main build.
[workspace]
members = ["."]

# Same fork as the root manifest: [patch] applies only in the root crate of a
# build, and this crate is one. Keep it in step with ../Cargo.toml.
[patch.crates-io]
tree-sitter = { git = "https://github.com/tstromberg/tree-sitter", branch = "master" }
tree-sitter-language = { git = "https://github.com/tstromberg/tree-sitter", branch = "master" }

[profile.release]
debug = 1

[[bin]]
name = "open_all_views"
path = "fuzz_targets/open_all_views.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fileid"
path = "fuzz_targets/fileid.rs"
test = false
doc = false
bench = false

