[package]
name = "filefacts"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
authors = ["The Atomdrift Project"]
description = "Extracts file facts: identification, structural values, strings, metrics, symbols, sections, AST, and recoverable parse errors."
license = "Apache-2.0"
repository = "https://codeberg.org/atomdrift/filefacts"
keywords = ["forensics", "binary-analysis", "metadata", "pe", "elf"]
categories = ["parsing", "command-line-utilities"]
readme = "README.md"

[lib]
name = "filefacts"
path = "src/lib.rs"

[[bin]]
name = "filefacts"
path = "src/bin/filefacts.rs"

[dependencies]
# Serialization — required for output schema.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error reporting — single source of truth for the public error type.
thiserror = "1"

# Fast byte scanning, used by string extractors and the magic-byte matcher.
memchr = "2"
aho-corasick = "1"
# CRC-32 — used as a non-crypto fingerprint over PE bound-import tables.
crc32fast = "1"
# x86/x86-64 instruction decoder — first-instruction decode at each PE
# export RVA powers stub/thunk alias detection.
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std"] }

# Authenticode signature verification — RSA-PKCS1v15 + ECDSA over
# the SignerInfo signed-attrs digest. Pure-Rust crypto.
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }

# Binary formats. `goblin` is a single crate that handles PE, ELF, and Mach-O
# behind one parse entry point; we use it for all three.
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64", "elf32", "elf64", "endian_fd", "mach32", "mach64", "archive"] }

# DWARF debug-info reader — surfaces DW_AT_producer (full compile
# command line per CU) and DW_AT_comp_dir from unstripped ELF
# binaries.
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }

# Language-aware string extractor — Go/Rust fat-pointer aware, dedupes
# packed runs, decodes XOR-obfuscated and base64-wrapped payloads.
# Cleave used to call this directly; centralising in filefacts lets every
# consumer get the same high-quality string set.
stng = { git = "https://codeberg.org/atomdrift/stng.git" }


# Archive index readers. We use these for header/central-directory enumeration
# only — never for decompression or extraction.
zip = "2"
tar = "0.4"
# XML parser for VSIX / WiX-style manifests. Pure Rust, no external
# binary calls.
roxmltree = "0.21"
# Deflate decompressor for PDF FlateDecode streams. Already in the
# transitive tree via `zip`; surfacing it as a direct dep avoids
# reaching through `zip`'s public re-exports.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Image decoders — used only to compute pixel-statistic metrics
# (per-channel entropy, edge density, histogram flatness) that power
# steganography detection. Decode is best-effort: structural marker /
# chunk metadata is always emitted, pixel stats are skipped silently
# on decode failure or oversize inputs.
jpeg-decoder = "0.3"
png = "0.17"

# Structured-format parsers.
serde_yaml = "0.9"
toml = "0.8"
plist = "1"

# Microsoft Compound File Binary Format (OLE2 / CFBF) — the storage
# layout for legacy Office documents (.doc / .xls / .ppt) and MSI / MSG.
cfb = "0.10"
# UUID handling — `cfb`'s storage-CLSID API takes a `uuid::Uuid` and we
# need to construct them in test fixtures.
uuid = "1"

# Regex engine for the VBA symbol extractor. No PCRE features used —
# the standard `regex` crate is enough.
regex = "1"

# Source-code extraction. Each language is its own crate; the base
# `tree-sitter` engine is shared. Adding a language is one dependency
# line plus one entry in `src/formats/source/langs.rs`.
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-objc = "3"
tree-sitter-kotlin-ng = "1"
tree-sitter-swift = "0.7"
tree-sitter-powershell = "0.25"
ts-parser-perl = "1.0.2"
tree-sitter-groovy = "0.1"
tree-sitter-zig = "1.1"
tree-sitter-elixir = "0.3"
tree-sitter-make = "1.1.1"

# Authenticode signature parsing. `cms` parses the PKCS#7 SignedData
# envelope; `x509-cert` decodes the embedded signer certificate;
# `der` handles the ASN.1 primitives the others build on.
cms = "0.2"
x509-cert = "0.2"
der = { version = "0.7", features = ["std"] }
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"

# Structured logging — used by rizin subprocess statistics emission.
tracing = "0.1"

# Disk cache — zstd-compressed bincode blobs keyed by sha256.
zstd = "0.13"
bincode = "1"

# OS cache directory lookup — `~/.cache/filefacts` (Linux) / `Library/Caches`
# (macOS) / `%LOCALAPPDATA%` (Windows).
dirs = "5"

# Temp file handling for rizin input materialisation. The existing rizin
# integration was using std::env::temp_dir manually; `tempfile` cleans
# up properly on Drop and avoids races.
tempfile = "3"

# Process group / RLIMIT / PR_SET_PDEATHSIG hooks for the hardened
# rizin subprocess. Unix only — the gates in `rizin.rs` are
# `#[cfg(unix)]`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Use jemalloc on unix systems where it isn't the OS default.
# FreeBSD/DragonFlyBSD ship jemalloc as the default; bundling a second copy
# causes TSD assertion failures in jails. OpenBSD's jemalloc version string
# format is incompatible with tikv-jemalloc-sys's configure script. illumos
# and Solaris ship libumem.
[target.'cfg(all(unix, not(any(target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "illumos", target_os = "solaris"))))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
# Snapshot-test framework used by per-format fixture tests.
insta = { version = "1", features = ["json"] }

[features]
default = []
# Enables jemalloc heap profiling. Build with:
#   cargo build --profile profiling --features jemalloc-prof --bin filefacts
# Run with (note the `_RJEM_` prefix — tikv-jemalloc renames MALLOC_CONF):
#   _RJEM_MALLOC_CONF="prof:true,prof_active:true,prof_final:true,lg_prof_interval:28,prof_prefix:out/heap/jeprof" \
#     out/filefacts.heap <path>
jemalloc-prof = ["tikv-jemallocator/profiling"]

[lints.rust]
# rizin subprocess hardening (libc::setrlimit pre_exec, libc::kill on the
# rizin process group, prctl PR_SET_PDEATHSIG on Linux) requires `unsafe`.
# These are tightly scoped to the rizin module and gated #[cfg(unix)];
# every other path stays unsafe-free.
unsafe_code = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public-API friction without forensic benefit.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Metrics are intentionally f64. The precision boundary at 2^53 is an
# accepted limit for forensic counts and sizes; values beyond that are
# either pathological inputs or already-fatal earlier in the pipeline.
cast_precision_loss = "allow"
# Tar mtime is stored as unsigned seconds; promoting to signed for the
# i64 metric range is intentional and harmless for all real timestamps.
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# These lints are intentionally noisy for this codebase: extractors share a
# uniform Result-returning dispatch signature, test fixtures use compact binary
# literals and tuple builders, and format parsers frequently manipulate bounded
# offsets after prior size checks. Keep correctness/safety lints active, but do
# not require churn for style-only rewrites that obscure format logic.
unnecessary_wraps = "allow"
cast_possible_truncation = "allow"
case_sensitive_file_extension_comparisons = "allow"
redundant_closure_for_method_calls = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
unnested_or_patterns = "allow"
needless_raw_string_hashes = "allow"
byte_char_slices = "allow"
int_plus_one = "allow"
cast_lossless = "allow"
manual_let_else = "allow"
redundant_pattern_matching = "allow"
manual_contains = "allow"
explicit_iter_loop = "allow"
type_complexity = "allow"
map_unwrap_or = "allow"
format_push_string = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"

for_kv_map = "allow"
match_same_arms = "allow"
used_underscore_binding = "allow"
clone_on_copy = "allow"
field_reassign_with_default = "allow"
needless_continue = "allow"
collapsible_match = "allow"
collapsible_if = "allow"
semicolon_if_nothing_returned = "allow"
doc_lazy_continuation = "allow"
bool_to_int_with_if = "allow"
manual_range_contains = "allow"
manual_abs_diff = "allow"
format_collect = "allow"
doc_overindented_list_items = "allow"
elidable_lifetime_names = "allow"
manual_find = "allow"
too_many_arguments = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
needless_character_iteration = "allow"
derivable_impls = "allow"
single_match_else = "allow"
borrow_as_ptr = "allow"
float_cmp = "allow"
unnecessary_trailing_comma = "allow"
match_wildcard_for_single_variants = "allow"

# Format-conventional names (PE, ELF, DLL, etc.) get backticked when
# they shouldn't have to be.
doc_markdown = "allow"
# Extraction routines are linear walks; their line count tracks the
# format's complexity, not architectural depth.
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = "none"
debug = 2
